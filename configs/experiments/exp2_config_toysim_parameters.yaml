experiment_name: "VSA-OGM Parameter Ablation"
experiment_type: "single_agent"
experiment_parameters:
  mapping:
    vector_dimensionality: [32768, 16384, 8192, 4096, 2048, 1024, 512, 256]
    vector_length_scale: [0.1, 0.2, 0.5, 1.0, 1.5, 2.0]
    num_tiles: [1, 2, 4, 8]

data:
  dataset_name: "toysim"
  data_dir: "datasets/sa/toysim0/npz"
  file_prefix: "results_frame_"
  file_suffix: ".npz"
  test_split: 0.2
  world_bounds: [-50, 50, -50, 50] # x_min, x_max, y_min, y_max; meters
logging:
  enabled: True
  log_images: True
  override_existing: False
  save_dir: "logs"
  verbose: False
  log_interval: 5
mapping:
  axis_resolution: 1.0
  data_filter: "passthrough"
  data_filter_args: {}
  decoding:
    method: "renyi_normalize_squaring"
    alpha: None
    disk_radii_1: 3
    disk_radii_2: 3
  device: "cuda"
  mapping_type: "SA_VSA_OGM"
  num_tiles: 1
  seed: 42
  vector_dimensionality: 2048
  vector_length_scale: 2.0
  verbose: True
mapping_manager:
  metrics: ["auc", "nll"]
  num_mappers: 1
  plotting_flags: 
    plot_metrics: True
    plot_point_clouds: False
    plot_predictions: False
    plot_images: False
  saving_flags:
    save_memory_vectors: False
    save_image_matrices: False
  seed: 42
  verbose: True
wandb:
  enabled: True
  notes: "This experiment evaluates the performance of the decoding method on the ablation dataset."
  online: True
  project_name: "VSA-OGM Parameter Ablation - ToySim - V2"
  verbose: False
