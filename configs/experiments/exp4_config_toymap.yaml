experiment_name: "exp4_ma_toymap"
experiment_type: "multi_agent"
num_agents: 2

agent_manager:
  experiment_name: "exp4_ma_toymap_manager_general"
  experiment_type: "multi_agent"

  logging:
    enabled: True
    log_images: True
    override_existing: False
    save_dir: "logs/ma"
    verbose: False
    log_interval: 5
  mapping:
    axis_resolution: 1.0
    data_filter: "passthrough"
    data_filter_args: {}
    decoding:
      method: "renyi_normalize_cubic"
      alpha: None
      disk_radii_1: 3
      disk_radii_2: 3
    device: "cuda"
    mapping_type: "SA_VSA_OGM"
    num_tiles: 2
    seed: 42
    vector_dimensionality: 32000
    vector_length_scale: 2.0
    verbose: True
  mapping_manager:
    metrics: ["auc", "nll"]
    num_mappers: 1
    plotting_flags: 
      plot_metrics: True
      plot_point_clouds: True
      plot_predictions: True
      plot_intermediate_representations: True
      plot_images: True
    saving_flags:
      save_memory_vectors: True
      save_image_matrices: True

    seed: 42
    verbose: True
  wandb:
    enabled: False
    notes: "This experiment evaluates the performance of the decoding method on the ablation dataset."
    online: True
    project_name: "VSA-OGM Exp4 Toy Sim Toy Sim Multi Agent - Manager"
    verbose: False


agent1:
  experiment_name: "exp4_ma_toymap_agent1_general"
  experiment_type: "multi_agent"

  data:
    dataset_name: "toysim"
    data_dir: "datasets/ma/toysim_agent1"
    file_prefix: "results_frame_"
    file_suffix: ".npz"
    test_split: 0.2
    world_bounds: [-50, 50, -50, 50] # x_min, x_max, y_min, y_max; meters
  logging:
    enabled: True
    log_images: True
    override_existing: False
    save_dir: "logs/ma"
    verbose: False
    log_interval: 5
  mapping:
    axis_resolution: 1.0
    data_filter: "passthrough"
    data_filter_args: {}
    decoding:
      method: "renyi_normalize_cubic"
      alpha: None
      disk_radii_1: 3
      disk_radii_2: 3
    device: "cuda"
    mapping_type: "SA_VSA_OGM"
    num_tiles: 2
    seed: 42
    vector_dimensionality: 32000
    vector_length_scale: 2.0
    verbose: True
  mapping_manager:
    metrics: ["auc", "nll"]
    num_mappers: 1
    plotting_flags: 
      plot_metrics: True
      plot_point_clouds: True
      plot_predictions: True
      plot_intermediate_representations: True
      plot_images: True
    saving_flags:
      save_memory_vectors: True
      save_image_matrices: True

    seed: 42
    verbose: True
  wandb:
    enabled: False
    notes: "This experiment evaluates the performance of the decoding method on the ablation dataset."
    online: True
    project_name: "VSA-OGM Exp4 Toy Sim Multi Agent - Agent 1"
    verbose: False

