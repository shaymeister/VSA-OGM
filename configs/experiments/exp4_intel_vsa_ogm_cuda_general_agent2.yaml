experiment_name: "exp3_ma_intel_vsa_ogm_cuda_general_agent2"
experiment_type: "multi_agent"

data:
  dataset_name: "pickle"
  "data_dir": datasets/ma/intel-quadrant2.pkl
  "world_bounds": [-20, 20, -25, 15] # x_min, x_max, y_min, y_max; meters
  test_split: 0.2
logging:
  enabled: True
  log_images: True
  override_existing: False
  save_dir: "logs"
  verbose: False
  log_interval: 25
mapping:
  axis_resolution: 0.1
  data_filter: "passthrough"
  data_filter_args: {}
  decoding:
    method: "renyi_normalize_squaring"
    alpha: None
    disk_radii_1: 1
    disk_radii_2: 1
  device: "cuda"
  mapping_type: "SA_VSA_OGM"
  num_tiles: 8
  seed: 42
  vector_dimensionality: 32000
  vector_length_scale: 0.2
  verbose: True
mapping_manager:
  metrics: ["auc", "nll"]
  num_mappers: 1
  plotting_flags: 
    plot_metrics: True
    plot_point_clouds: False
    plot_predictions: True
    plot_intermediate_representations: True
    plot_images: True
  saving_flags:
    save_memory_vectors: True
    save_image_matrices: True

  seed: 42
  verbose: True
wandb:
  enabled: False
  notes: "This experiment evaluates the performance of the decoding method on the ablation dataset."
  online: True
  project_name: "VSA-OGM Exp3 Intel VSA OGM Cuda General"
  verbose: False
