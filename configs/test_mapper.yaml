experiment_name: "baseline_mapping_tester"
experiment_type: "single_agent"
data:
  dataset_name: "toysim"
  data_dir: "datasets/sa/toysim0/npz"
  file_prefix: "results_frame_"
  file_suffix: ".npz"
  world_bounds: [-50, 50, -50, 50] # x_min, x_max, y_min, y_max; meters
logging:
  enabled: True
  override_existing: False
  save_dir: "logs"
  verbose: False
mapping:
  axis_resolution: 0.5
  data_filter: "passthrough"
  data_filter_args: {}
  device: "cpu"
  mapping_type: "SA_VSA_OGM"
  num_tiles: 1
  seed: 42
  vector_dimensionality: 256
  vector_length_scale: 1.0
mapping_manager:
  metrics: ["auc", "f1", "precision", "recall", "accuracy", "nll"]
  num_mappers: 1
  plotting_flags: 
    plot_metrics: True
    plot_points_clouds: True
  verbose: True
wandb:
  enabled: False
  notes: "<TODO - Add notes here>"
  online: True
  project_name: "baseline_mapping_tester"
  verbose: False